name: Build & Release

# Se déclenche quand tu pousses un tag vX.X.X
# Usage : git tag v1.3.0 && git push --tags
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1. Code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Version extraite du tag (ex: v1.3.0 -> 1.3.0)
      #    On la stocke dans une env var pour éviter toute injection dans run:
      - name: Extract version
        id: version
        shell: bash
        run: |
          RAW="${GITHUB_REF_NAME}"
          VERSION="${RAW#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      # 3. Sync $AppVersion dans le .ps1
      - name: Sync version in ps1
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          $v = $env:APP_VERSION
          $content = Get-Content yt-grab.ps1 -Raw -Encoding UTF8
          $content = $content -replace "(\`\$AppVersion\s*=\s*')[^']+(')", "`${1}$v`${2}"
          $utf8bom = New-Object System.Text.UTF8Encoding($true)
          [System.IO.File]::WriteAllText("$PWD\yt-grab.ps1", $content, $utf8bom)

      # 4. Compile ps1 -> exe via ps2exe
      - name: Compile exe (ps2exe)
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          Install-Module ps2exe -Scope CurrentUser -Force -AllowClobber
          Import-Module ps2exe
          $v = $env:APP_VERSION
          Invoke-PS2EXE `
            -InputFile  yt-grab.ps1 `
            -OutputFile yt-grab.exe `
            -NoConsole `
            -Title       'YouTube Grabber by n3lio' `
            -Description 'YouTube Grabber by n3lio' `
            -Company     'n3lio' `
            -Product     'YouTube Grabber' `
            -Version     $v `
            -Copyright   "(c) n3lio" `
            -IconFile    yt-grab.ico `
            -STA

      # 5. Installe Inno Setup silencieusement
      - name: Install Inno Setup
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://jrsoftware.org/download.php/is.exe' -OutFile is-installer.exe
          Start-Process is-installer.exe -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait

      # 6. Met à jour la version dans .iss et compile le setup
      - name: Build installer (Inno Setup)
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          $v = $env:APP_VERSION
          $iss = Get-Content installer.iss -Raw -Encoding UTF8
          $iss = $iss -replace '(#define AppVersion\s+")[^"]+(")', "`${1}$v`${2}"
          Set-Content installer.iss $iss -Encoding UTF8
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          & $iscc installer.iss
          Get-ChildItem dist\*.exe | ForEach-Object { Write-Host "Installer: $_" }

      # 7. Publie la GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          APP_VERSION: ${{ steps.version.outputs.VERSION }}
        with:
          name: "v${{ steps.version.outputs.VERSION }}"
          body: |
            ## YouTube Grabber v${{ steps.version.outputs.VERSION }}

            ### Installation
            1. Télécharge `yt-grab-${{ steps.version.outputs.VERSION }}-setup.exe` ci-dessous
            2. Double-clique et suis l'installeur
            3. Lance *YouTube Grabber* depuis le Bureau ou le Menu Démarrer

            ### Prérequis
            - Windows 10/11
            - Rien d'autre — yt-dlp et ffmpeg sont téléchargés automatiquement au premier lancement ✔
          files: dist/yt-grab-${{ steps.version.outputs.VERSION }}-setup.exe
          draft: false
          prerelease: false
