name: Build & Release (Windows)

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: |
          RAW="${GITHUB_REF_NAME}"
          VERSION="${RAW#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync version in ps1
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          $v = $env:APP_VERSION
          $content = Get-Content windows/yt-grab.ps1 -Raw -Encoding UTF8
          $content = $content -replace "(\`\$AppVersion\s*=\s*')[^']+(')", "`${1}$v`${2}"
          $utf8bom = New-Object System.Text.UTF8Encoding($true)
          [System.IO.File]::WriteAllText("$PWD\windows\yt-grab.ps1", $content, $utf8bom)

      - name: Compile exe (ps2exe)
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          Install-Module ps2exe -Scope CurrentUser -Force -AllowClobber
          Import-Module ps2exe
          $v = $env:APP_VERSION
          Invoke-PS2EXE `
            -InputFile  windows/yt-grab.ps1 `
            -OutputFile windows/yt-grab.exe `
            -NoConsole `
            -Title       'YouTube Grabber by n3lio' `
            -Description 'YouTube Grabber by n3lio' `
            -Company     'n3lio' `
            -Product     'YouTube Grabber' `
            -Version     $v `
            -Copyright   "(c) n3lio" `
            -IconFile    windows/yt-grab.ico `
            -STA

      - name: Install Inno Setup
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://jrsoftware.org/download.php/is.exe' -OutFile is-installer.exe
          Start-Process is-installer.exe -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait

      - name: Build installer (Inno Setup)
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          $v = $env:APP_VERSION
          $iss = Get-Content windows/installer.iss -Raw -Encoding UTF8
          $iss = $iss -replace '(#define AppVersion\s+")[^"]+(")', "`${1}$v`${2}"
          Set-Content windows/installer.iss $iss -Encoding UTF8
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          & $iscc windows/installer.iss
          Get-ChildItem windows/dist/*.exe | ForEach-Object { Write-Host "Installer: $_" }

      - name: Upload Windows installer
        uses: softprops/action-gh-release@v2
        with:
          files: windows/dist/yt-grab-${{ steps.version.outputs.VERSION }}-setup.exe
          draft: false
          prerelease: false
